{# templates/partials/stat_card.html — tarjeta de estadística reutilizable #}
<div class="col-6 col-xl-3">
    <div class="stat-card">
        <div class="stat-icono stat-{{ tono }}">
            <i class="fas fa-{{ icono }}"></i>
        </div>
        <div>
            <p class="stat-valor">{{ valor }}</p>
            <p class="stat-label">{{ label }}</p>
        </div>
    </div>
</div>
