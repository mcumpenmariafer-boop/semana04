{# templates/partials/stat_card.html — tarjeta de estadística reutilizable #}
<div class="col-md-3 col-sm-6">
    <div class="card stat-card shadow-sm mb-3" style="border-left-color: {{ color_hex }}">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h6 class="card-title text-muted mb-1">{{ label }}</h6>
                <h2 class="mb-0">{{ valor }}</h2>
            </div>
            <i class="fas fa-{{ icono }} fa-2x opacity-50" style="color: {{ color_hex }}"></i>
        </div>
    </div>
</div>
