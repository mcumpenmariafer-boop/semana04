{% extends 'base.html' %}

{% block title %}Eliminar {{ enc.codigo }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body text-center p-4">
                <i class="fas fa-trash-alt fa-3x text-danger mb-3"></i>
                <h4>¿Eliminar la encomienda {{ enc.codigo }}?</h4>
                <p class="text-muted">{{ enc.descripcion|truncatechars:60 }} — {{ enc.ruta }}</p>
                <form method="post" id="formEliminar">
                    {% csrf_token %}
                    <a href="{% url 'encomienda_detalle' enc.pk %}" class="btn btn-outline-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-danger" onclick="return confirmar('¿Eliminar este registro?')">Eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
