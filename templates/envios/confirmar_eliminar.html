{% extends 'base.html' %}

{% block title %}Eliminar {{ enc.codigo }}{% endblock %}

{% block content %}
<div class="confirmar">
    <section class="panel panel-body text-center">
        <div class="confirmar-icono"><i class="fas fa-trash-can"></i></div>
        <h1 class="h4">¿Eliminar la encomienda {{ enc.codigo }}?</h1>
        <p class="text-muted">{{ enc.descripcion|truncatechars:60 }} · {{ enc.ruta }}<br>Esta acción no se puede deshacer.</p>
        <form method="post" id="formEliminar" class="d-flex justify-content-center gap-2 mt-4">
            {% csrf_token %}
            <a href="{% url 'encomienda_detalle' enc.pk %}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-danger" onclick="return confirmar('¿Eliminar este registro?')">Eliminar encomienda</button>
        </form>
    </section>
</div>
{% endblock %}
